[project]
name = "folio"
version = "2.0.0"
requires-python = ">=3.12"
# Keep runtime dependencies in sync with requirements.txt.
dependencies = [
    "fastapi>=0.110.0,<=0.162.0",
    "uvicorn[standard]>=0.28.0,<=0.49.0",
    "pydantic>=2.6.0,<=2.14.2",
    "pydantic-settings>=2.2.0,<=2.15.0",
    "sqlalchemy>=2.0.28,<=2.0.55",
    "psycopg[binary]>=3.1.18,<=3.3.6",
    "alembic>=1.13.1,<=1.20.1",
    "argon2-cffi>=23.1.0,<=25.1.0",
    "python-multipart>=0.0.9,<=0.0.32",
    "bleach>=6.1.0,<=6.4.0",
    "markdown>=3.6,<=3.10.2",
    "python-dotenv>=1.0.1,<=1.2.2",
    "cryptography>=42.0.0,<=48.0.0",
]

[tool.vercel]
entrypoint = "src.backend.main:app"
