version: '3.8'

# ==============================================================================
# Folio Production / Staging-like Docker Compose Architecture
# Multi-container topology with network isolation, healthcheck dependencies,
# non-root workers, and zero exposed backend ports.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy (Nginx with HTTPS, security headers & HTTP->HTTPS redirect)
  # Only service with public ports exposed to the host/internet.
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: folio-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    networks:
      - frontend-net
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy/templates:/etc/nginx/templates:ro
      - folio-proxy-certs:/etc/nginx/certs:ro
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.localhost}
      HSTS_HEADER: ${HSTS_HEADER:-# HSTS disabled in development/staging}
    depends_on:
      web:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Web Application Service (FastAPI ASGI under Uvicorn)
  # Internal network only; non-root user 'folio'; persists shared index data.
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio-web
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net
    volumes:
      - folio-index-data:/app/data/search_index
      - folio-media-data:/app/data/media
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-folio_prod_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME:-localhost}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8}
      INDEX_STORAGE_DIR: /app/data/search_index/generations
      ENABLE_LEGACY_SEARCH: ${ENABLE_LEGACY_SEARCH:-false}
      CHROMA_PATH: /app/data/vector
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Search Index Lifecycle Worker Service (Background Daemon)
  # Dedicated container polling outbox index_jobs; never runs migrations.
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio-worker
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoints/entrypoint-worker.sh"]
    networks:
      - backend-net
    volumes:
      - folio-index-data:/app/data/search_index
      - folio-media-data:/app/data/media
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-folio_prod_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}}
      INDEX_STORAGE_DIR: /app/data/search_index/generations
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1.0}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Primary Relational Database (PostgreSQL 16)
  # Internal network only; persistent data volume; healthcheck via pg_isready.
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: folio-postgres
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folio}
      POSTGRES_USER: ${POSTGRES_USER:-folio_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - folio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Semantic Vector Database Profile (ChromaDB - Optional)
  # Activated only when running with --profile semantic.
  # ----------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:0.5.20
    container_name: folio-chroma
    profiles:
      - semantic
    restart: unless-stopped
    networks:
      - backend-net
    volumes:
      - folio-chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  # ----------------------------------------------------------------------------
  # 6. Database Migration & Provisioning Runner (One-Shot Tool)
  # Activated on-demand via: docker compose -f docker-compose.prod.yml run --rm migration
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio-migration
    profiles:
      - tools
    restart: "no"
    entrypoint: ["/app/docker/entrypoints/entrypoint-migrate.sh"]
    networks:
      - backend-net
    volumes:
      - folio-index-data:/app/data/search_index
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-folio_prod_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@folio.example.com}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-superadmin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  folio-pgdata:
    name: folio-pgdata
  folio-index-data:
    name: folio-index-data
  folio-media-data:
    name: folio-media-data
  folio-chroma-data:
    name: folio-chroma-data
  folio-proxy-certs:
    name: folio-proxy-certs

networks:
  frontend-net:
    name: folio-frontend-net
    driver: bridge
  backend-net:
    name: folio-backend-net
    driver: bridge
    internal: true
